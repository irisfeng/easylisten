name: 每日精选失败自动恢复

on:
  workflow_run:
    workflows: ["每日精选"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "包含 daily-recovery 快照的每日精选运行 ID"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: daily-curation-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: 下载失败运行保存的出刊快照
        id: snapshot
        uses: actions/download-artifact@v4
        with:
          pattern: daily-recovery-*
          path: _recovery_snapshot
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 确认并恢复出刊快照
        id: snapshot_guard
        run: |
          test -f _recovery_snapshot/content/daily.json || {
            echo "失败运行没有生成 daily-recovery 快照，不能拿主分支旧刊冒充恢复成功"
            exit 1
          }
          cp -R _recovery_snapshot/content/. content/
          test ! -d _recovery_snapshot/public/audio || cp -R _recovery_snapshot/public/audio/. public/audio/
          test ! -d _recovery_snapshot/public/editorial || cp -R _recovery_snapshot/public/editorial/. public/editorial/
          echo "ISSUE_DATE=$(jq -r '.[0].publishedAt' content/daily.json)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 校验发布契约
        run: |
          npm run test:speech
          npm run test:curation

      - name: 安装 ffmpeg
        run: |
          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -version | head -1
          else
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi

      - name: 只补快照中的缺失音轨
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_TTS_MODEL: ${{ vars.MINIMAX_TTS_MODEL }}
          MINIMAX_MAX_CHARS_PER_RUN: ${{ vars.MINIMAX_MAX_CHARS_PER_RUN || '12000' }}
          REQUIRE_AUDIO_CONTRACT: "true"
          ALLOW_MINIMAX_ENGLISH_FALLBACK: "true"
        run: node scripts/run-synthesis-with-recovery.mjs

      - name: 提交恢复后的今日日刊
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "easylisten-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/daily.json content/editorial.json public/audio public/editorial
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: 自动恢复每日精选音频"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          pushed=""
          for i in 1 2 3; do
            git push "$REMOTE" "HEAD:${GITHUB_REF_NAME}" && { pushed=1; break; }
            echo "push 失败,变基重试 ($i/3)"
            git pull --rebase "$REMOTE" "${GITHUB_REF_NAME}"
            sleep 5
          done
          [ -n "$pushed" ] || { echo "三次推送均失败"; exit 1; }

      - name: 恢复成功后关闭当日告警
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list -R "$GITHUB_REPOSITORY" --state open --search "每日精选 ${ISSUE_DATE} 出刊失败 in:title" --json number,title \
            --jq '.[] | select(.title | contains("每日精选") and contains("出刊失败")) | .number' |
          while read -r issue; do
            [ -z "$issue" ] || gh issue close -R "$GITHUB_REPOSITORY" "$issue" --comment "${ISSUE_DATE} 已由自动恢复成功补发。"
          done
          gh issue list -R "$GITHUB_REPOSITORY" --state open --search "每日精选自动恢复仍未完成 in:title" --json number,title \
            --jq '.[] | select(.title == "⚠️ 每日精选自动恢复仍未完成") | .number' |
          while read -r issue; do
            [ -z "$issue" ] || gh issue close -R "$GITHUB_REPOSITORY" "$issue" --comment "${ISSUE_DATE} 已由自动恢复成功补发。"
          done

      - name: 恢复失败告警
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="⚠️ 每日精选自动恢复仍未完成"
          issue="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          body="自动恢复未完成；每日看门狗会在最终补发窗口再检查一次。恢复日志：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$issue" ]; then
            gh issue comment -R "$GITHUB_REPOSITORY" "$issue" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
